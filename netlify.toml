# Grattouille — configuration Netlify (BRIEF.md, section 16.2)
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Fichiers nommés avec une empreinte : cache long (section 17.2).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
